# Windows-Release der Desktop-App: Installer (NSIS) und Portable-EXE.
# Läuft bei Tags v* (z. B. v2.0.0) und manuell („Run workflow“). Bei Tags werden die Dateien
# als Release-Assets veröffentlicht, sonst nur als Artefakte des Laufs hochgeladen.
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_regression:
        description: 'Regressionstests (Browser) überspringen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # nicht signieren (kein Zertifikat hinterlegt)
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Tag und package.json-Version vergleichen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} passt nicht zu package.json ($version)" }

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build (dist/PDF-Editor.html, Lizenzhinweise)
        run: npm run build:desktop

      - name: Chromium für Playwright installieren
        run: npx playwright install chromium

      - name: Desktop-Smoke-Test (Electron, Playwright)
        run: npx playwright test tests/desktop.spec.js

      - name: Regressionstests (Browser)
        if: ${{ !inputs.skip_regression }}
        run: npx playwright test tests/regression.spec.js

      - name: Installer und Portable bauen
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Paket prüfen – startet mit PDF als Argument, Fenstertitel = Dateiname
        run: |
          $exe = Resolve-Path 'release\win-unpacked\PDF-Editor.exe'
          $pdf = Join-Path $env:RUNNER_TEMP 'smoke.pdf'
          Copy-Item 'tests\fixtures\dokument.pdf' $pdf
          $env:PDF_EDITOR_USER_DATA = Join-Path $env:RUNNER_TEMP 'pdf-editor-smoke'
          $p = Start-Process -FilePath $exe -ArgumentList "`"$pdf`"" -PassThru
          $title = ''
          for ($i = 0; $i -lt 60 -and -not $p.HasExited; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            $title = $p.MainWindowTitle
            if ($title -like 'smoke.pdf*PDF-Editor') { break }
          }
          Write-Host "Fenstertitel: $title"
          if ($p.HasExited) { throw "PDF-Editor hat sich beendet (Exit-Code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if ($title -notlike 'smoke.pdf*PDF-Editor') { throw 'Die Datei wurde nicht geöffnet.' }

      - name: Installer prüfen – stille Benutzerinstallation, Dateizuordnung, Deinstallation
        run: |
          $setup = Get-ChildItem release -Filter 'PDF-Editor-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\PDF-Editor'
          if (-not (Test-Path (Join-Path $dir 'PDF-Editor.exe'))) { throw "Nicht installiert: $dir" }
          $progids = Get-ItemProperty 'HKCU:\Software\Classes\.pdf\OpenWithProgids' -ErrorAction SilentlyContinue
          if (-not $progids -or -not ($progids.PSObject.Properties.Name -contains 'PDFEditor.Dokument')) { throw '.pdf-Zuordnung fehlt' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'PDF-Editor.lnk'
          if (-not (Test-Path $lnk)) { throw "Startmenü-Verknüpfung fehlt: $lnk" }
          Start-Process -FilePath (Join-Path $dir 'Uninstall PDF-Editor.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'PDF-Editor.exe')); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path (Join-Path $dir 'PDF-Editor.exe')) { throw 'Deinstallation unvollständig' }
          if (Test-Path 'HKCU:\Software\Classes\PDFEditor.Dokument') { throw 'ProgID nach Deinstallation noch vorhanden' }
          Write-Host 'Installation, Zuordnung und Deinstallation in Ordnung.'

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Editor-Windows
          path: |
            release/PDF-Editor-Setup-*.exe
            release/PDF-Editor-*-portable.exe
            dist/PDF-Editor.html
          if-no-files-found: error

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PDF-Editor-Setup-*.exe
            release/PDF-Editor-*-portable.exe
            dist/PDF-Editor.html
          fail_on_unmatched_files: true

      - name: Testergebnisse bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
